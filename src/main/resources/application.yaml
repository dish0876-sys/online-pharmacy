spring:
  datasource:
    url: jdbc:h2:mem:pharmacydb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update # Автоматически создает/обновляет таблицы
    show-sql: true
  h2:
    console:
      enabled: true # Включает веб-консоль для просмотра БД